        * {margin:0px;padding:0px;}
body {
  background:black;
  width: 800px;

  p {
    color: grey;
    text-align:center;
    font-size:2em;
  }
}

#container2 h1,#container h1 {
  color: green;
}
h2 { text-align:center;color:red;text-transform:uppercase;}

#container {
  float:left;
}
#container, #container2 {
  height:440px;
  width:400px;
  position:relative;
  margin:auto auto;
  background:black;
  overflow:hidden;
  border-radius:20%;
  margin:0 auto 0px auto;
    box-shadow:2px 2px 3px rgba(0,0,0,0.3);
}

#clock,#clock2 {
    zoom:70%;
  height:400px;
  width:400px;
  position:relative;
  margin:50px auto;
  background:white;
  border-radius:50%;
  
  #HourDial,#HourDial2 {
    position:absolute;
    height:80px;
    width:5px;
    background:black;
    top:0px;
    bottom:0px;
    left:0px;
    right:0px;
    border-radius:20px;
    border:1px solid rgba(0,0,0,1);
    margin:120px auto auto auto;
    transform-origin: 50% 100%;
    z-index:2;    
    box-shadow:-2px 2px 3px rgba(0,0,0,0.3);
    
    div {
      height:20px;
      width:5px;
      background:black;
      position:inherit;
      bottom:-20px;
    }
  }
  
  #MinDial, #MinDial2 {
    @extend #HourDial;
    height:100px;
    width:5px;
    margin:100px auto auto auto;
    transform-origin: 50% 100%;
    z-index:3;
  }
  #SecDial, #SecDial2 {
    @extend #HourDial;
    height:130px;
    width:2px;
    background:#dd1b18;
    margin:70px auto auto auto;
    border:none;
    transform-origin: 50% 100%;
    z-index:4; 
    
  }
  
  #centerDial, #centerDial2 {
    height:15px;
    width:15px;
    background:black;
    border-radius:50%;
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    margin:auto auto;
    z-index:6;
  }
  #centerDialEx, #centerDialEx2 {
    @extend #centerDial;
    background:white;
    height:5px;
    width:5px;
  }
  
  .text, .text2 {
    height:30px;
    width:100%;
    position:absolute;
    left:0;
    right:0;
    top:250px;
    bottom:0;
    color:black;
    text-align:center;
    font-size:20px;
    margin: auto;
    z-index:1;
    font-family: 'Oswald', sans-serif;
    text-transform:uppercase;
  }
}
  h1 {
    font-family: 'Oswald', sans-serif;
    text-align:center;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    color:rgba(30,30,30,1);
  }
a {text-decoration:none;color:inherit;}
